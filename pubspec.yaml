name: takeed
description: Push notifications for Flutter apps on Takeed (takeed-iq.com), with direct FCM and APNs delivery. Drop-in replacement for onesignal_flutter v5.
version: 2.1.0
homepage: https://takeed-iq.com
repository: https://github.com/cherryserious/takeed-flutter
issue_tracker: https://github.com/cherryserious/takeed-flutter/issues
topics:
  - push-notifications
  - notifications
  - firebase-messaging
  - onesignal

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.takeed
        pluginClass: TakeedPlugin
      ios:
        pluginClass: TakeedPlugin
